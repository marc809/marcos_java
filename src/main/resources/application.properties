# ── Aplicación ────────────────────────────────────────────────
spring.application.name=chacomer

# ── Conexión a PostgreSQL (manual LP3) ────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/lp3_db
spring.datasource.username=lp3_user
spring.datasource.password=lp3_pass

# ── Comportamiento del esquema ────────────────────────────────
# update: crea o actualiza las tablas al arrancar la aplicación
spring.jpa.hibernate.ddl-auto=update

# ── Diagnóstico ───────────────────────────────────────────────
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── WhatsApp de ventas ────────────────────────────────────────
# Número con código de país, sin + ni espacios (Paraguay = 595).
# Cambiá este valor por el número real de la tienda.
chacomer.whatsapp=595985907585
chacomer.nombre=Chacomer Motos
